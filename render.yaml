services:
  - type: web
    name: crm-antony-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    autoDeploy: true
    numInstances: 1
    pullRequestPreviewsEnabled: false
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: false
      - key: NODE_OPTIONS
        value: '--dns-result-order=ipv4first --max-old-space-size=1024'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://inmobiliaria-7y6glff57-raulmgxs-projects.vercel.app,https://*.vercel.app,https://*.onrender.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001'
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: SUPABASE_STORAGE_BUCKET
        value: whatsapp-media
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTERNAL_CRON_SECRET
        generateValue: true
