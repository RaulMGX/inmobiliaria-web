services:
  - type: web
    name: crm-antony-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build:render
    startCommand: node dist/src/main.js
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
