services:
  - type: web
    name: crm-antony-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build:render
    startCommand: npm run start:render
    autoDeploy: true
    numInstances: 1
    pullRequestPreviewsEnabled: false
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: 'https://inmobiliaria-7y6glff57-raulmgxs-projects.vercel.app,https://*.vercel.app,https://*.onrender.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001'
